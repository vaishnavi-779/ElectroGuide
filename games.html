<style>
.game-hub{max-width:1150px;margin:28px auto}.game-select{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.game-tab{padding:12px 15px;border:1px solid rgba(0,255,200,.2);border-radius:12px;background:rgba(255,255,255,.035);color:inherit;cursor:pointer;font-weight:700}.game-tab.active,.game-tab:hover{border-color:#00ffc8;background:rgba(0,255,200,.1)}.lab{border:1px solid rgba(0,255,200,.22);border-radius:20px;background:rgba(5,15,22,.92);padding:24px}.lab-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.lab-head h2{margin:0 0 7px}.lab-head p{opacity:.72;margin:0;line-height:1.6}.lab-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;margin-top:22px}.board{position:relative;min-height:480px;border:1px solid rgba(0,255,200,.16);border-radius:16px;background:radial-gradient(circle at 50% 45%,rgba(0,255,200,.07),transparent 50%),#07121a;overflow:hidden}.board svg{width:100%;height:100%;min-height:480px}.wire{stroke:#00ffc8;stroke-width:4;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(0,255,200,.45))}.terminal{fill:#ffd166;stroke:#07121a;stroke-width:3;cursor:pointer}.terminal.selected{fill:#fff;stroke:#00ffc8;stroke-width:5}.component-body{fill:#172b36;stroke:#5b7b88;stroke-width:2}.component-label{fill:#dff; font-size:15px;font-weight:800;text-anchor:middle}.component-note{fill:#91aab5;font-size:12px;text-anchor:middle}.palette{display:grid;gap:10px;align-content:start}.tool-card{padding:15px;border:1px solid rgba(0,255,200,.15);border-radius:14px;background:rgba(255,255,255,.035)}.tool-card h3{font-size:15px;margin:0 0 8px}.tool-card p{font-size:13px;line-height:1.5;opacity:.72;margin:0}.status{margin-top:15px;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);line-height:1.55;min-height:24px}.status.ok{border-color:rgba(40,232,154,.5);background:rgba(40,232,154,.08)}.status.bad{border-color:rgba(255,102,122,.5);background:rgba(255,102,122,.08)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.lab-btn{padding:11px 16px;border:0;border-radius:11px;background:#00ffc8;color:#061117;font-weight:900;cursor:pointer}.lab-btn.secondary{background:rgba(255,255,255,.08);color:inherit;border:1px solid rgba(255,255,255,.12)}.value-row{display:flex;gap:7px;flex-wrap:wrap}.value-btn{padding:9px 12px;border-radius:9px;border:1px solid rgba(0,255,200,.18);background:rgba(255,255,255,.04);color:inherit;cursor:pointer}.value-btn.active{border-color:#00ffc8;background:rgba(0,255,200,.12)}.meter{font-size:29px;font-weight:900;text-align:center;padding:15px;border-radius:12px;background:#02080c;border:1px solid rgba(0,255,200,.2);margin-top:10px}.scope{background:#02080c;border:1px solid rgba(0,255,200,.2);border-radius:12px;padding:8px}.scope canvas{width:100%;height:180px;display:block}.node{cursor:pointer}.node rect{fill:#132833;stroke:#63808b;stroke-width:2}.node text{fill:#e5ffff;font-weight:800;text-anchor:middle}.node .port{fill:#ffd166;stroke:#07121a;stroke-width:2}.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px}.switch{width:48px;height:26px;border-radius:20px;border:1px solid #54717d;background:#12232c;cursor:pointer;position:relative}.switch:after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#78909c;transition:.2s}.switch.on{background:rgba(0,255,200,.2);border-color:#00ffc8}.switch.on:after{left:25px;background:#00ffc8}@media(max-width:800px){.lab-layout{grid-template-columns:1fr}.lab-head{flex-direction:column}.board,.board svg{min-height:400px}}
