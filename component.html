<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Components | ElectroGuide</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile.css"></head><body>
<header class="component-header"><a href="index.html" class="logo">ElectroGuide</a><div class="header-tools"><div class="global-search"><span>⌕</span><input id="global-search-input" type="search" placeholder="Search any component..." autocomplete="off"><div id="search-results" class="search-results"></div></div><a href="index.html" class="back-button">← Home</a></div></header>

const content=document.getElementById("component-content"),p=new URLSearchParams(location.search),categoryKey=p.get("category"),componentName=p.get("name"),parent=p.get("parent");function titleFromSlug(slug){return titleFromSlugForData(slug)}
function renderInternal(items,isBoard){if(!items?.length)return"";return `<section class="internal-section"><div class="section-heading"><span>02</span><h2>${isBoard?"Inside this board":"Inside this component"}</h2></div><p class="section-note">Select any hardware block to learn what it does.</p><div class="internal-grid">${items.map(x=>`<button class="internal-card" onclick="openComponent('${x.id}','${componentName||""}')"><strong>${x.name}</strong><span>${x.description}</span><em>View component →</em></button>`).join("")}</div></section>`}
function imageFallback(name){return "https://placehold.co/900x600/f5f8fa/245a82?text="+encodeURIComponent(name)}

};

function imageQueryFor(item){
  const slug=Object.keys(categories||{}).length ? Object.keys(imageQueryAliases).find(k=>k===item._slug) : null;
  const raw=imageQueryAliases[slug]||wikiTitle(item.name)+" electronic component";
  return raw;
}
function scoreImageCandidate(page,query){
  const title=(page.title||"").toLowerCase().replace(/[^a-z0-9]+/g," ");
  const desc=String(page.imageinfo?.[0]?.extmetadata?.ImageDescription?.value||"").replace(/<[^>]*>/g," ").toLowerCase();
  const q=query.toLowerCase().replace(/[^a-z0-9]+/g," ").split(/\\s+/).filter(w=>w.length>2);
  let score=0;
  q.forEach(w=>{if(title.includes(w))score+=4;if(desc.includes(w))score+=1});
  if(/symbol|schematic|diagram|circuit symbol/.test(title))score-=6;
  if(page.imageinfo?.[0]?.mime?.startsWith("image/"))score+=2;
  return score;
}
async function searchCommonsImage(query){
  try{
    const url="https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(query)+"&gsrnamespace=6&gsrlimit=15&prop=imageinfo&iiprop=url|mime|extmetadata&iiurlwidth=900&format=json&origin=*";
    const r=await fetch(url,{headers:{Accept:"application/json"}});
    if(!r.ok)return null;
    const d=await r.json();
    const pages=Object.values(d.query?.pages||{}).filter(x=>x.imageinfo?.[0]?.thumburl||x.imageinfo?.[0]?.url);
    pages.sort((a,b)=>scoreImageCandidate(b,query)-scoreImageCandidate(a,query));
    const best=pages[0];
    if(best?.imageinfo?.[0])return {src:best.imageinfo[0].thumburl||best.imageinfo[0].url,title:best.title||"Wikimedia Commons"};
  }catch(e){}
  return null;
}
function setImage(src,caption){const img=document.getElementById("component-photo");if(!img||!src)return;img.src=src;img.dataset.real="1";const cap=document.getElementById("image-caption");if(cap)cap.textContent=caption||"Reference image"}
async function loadComponentImage(item){
  const img=document.getElementById("component-photo");
  if(!img)return;
  const slug=item._slug||item.id||"";
  const query=imageQueryAliases[slug]||wikiTitle(item.name)+" electronic component";
  const cacheKey="electroguide-image-v2-"+slug;
  try{const cached=localStorage.getItem(cacheKey);if(cached){const d=JSON.parse(cached);if(d?.src){setImage(d.src,"Reference image • Wikimedia Commons");return}}}catch(e){}
  const common=await searchCommonsImage(query);
  if(common?.src){setImage(common.src,"Reference image • Wikimedia Commons • "+common.title);try{localStorage.setItem(cacheKey,JSON.stringify(common))}catch(e){}return}
  try{
    let r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(wikiTitle(item.name)),{headers:{Accept:"application/json"}});
    if(r.ok){const d=await r.json();const src=d.originalimage?.source||d.thumbnail?.source;if(src){setImage(src,"Reference image • Wikipedia");return}}
  }catch(e){}
  img.src=imageFallback(item.name);const cap=document.getElementById("image-caption");if(cap)cap.textContent="No verified image found yet • component illustration";
}
function render(item){const facts=item.facts||[["Category",item.category],["Type","Electronics component"]];const isBoard=item.category==="Microcontrollers";const initial=item.image||imageFallback(item.name);return `<div class="component-badge">${item.category}</div><h1>${item.name.toUpperCase()}</h1><p class="component-intro">${item.description}</p><div class="component-main-card"><div class="component-image"><img id="component-photo" src="${initial}" alt="${item.name} electronic component" loading="eager"><div class="component-illustration">⚡<span>${item.name}</span></div><p id="image-caption">${item.image?"Reference image":"Loading component reference…"}</p></div><div class="quick-info"><h2>Quick Specifications</h2>${facts.map(f=>`<div class="fact"><span>${f[0]}</span><strong>${f[1]}</strong></div>`).join("")}</div></div>${Object.entries(item.sections||{}).map(([h,t])=>`<section class="learning-section"><h2>${h}</h2><p>${t}</p></section>`).join("")}${renderInternal(item.internalComponents,isBoard)}${parent?`<a class="parent-link" href="component.html?name=${encodeURIComponent(parent)}">← Back to ${titleFromSlug(parent)}</a>`:""}`}
if(componentName){const item=electroGuideDetails[componentName]||electroGuideInternalDetails[componentName]; if(item)item._slug=componentName;if(item){document.title=item.name+" | ElectroGuide";content.innerHTML=render(item);if(!item.image||item.image.includes("placehold.co"))loadComponentImage(item);else setImage(item.image,"Reference image • Wikimedia Commons")}else content.innerHTML=`<h1>Component not found</h1><p class="component-intro">Use the search box to find another component.</p>`}else if(categoryKey&&categories[categoryKey]){const c=categories[categoryKey];document.title=c.name+" | ElectroGuide";content.innerHTML=`<div class="component-badge">COMPONENT LIBRARY</div><h1>${c.name.toUpperCase()}</h1><p class="component-intro">${c.items.length} components. Select one to open its learning page.</p><div class="components component-list">${c.items.map((id,i)=>`<button class="category component-list-item" onclick="openComponent(&quot;${id}&quot;)"><span class="component-number">${String(i+1).padStart(2,"0")}</span><span>${titleFromSlug(id)}</span></button>`).join("")}</div>`}else content.innerHTML='<h1>Components</h1><p class="component-intro">Choose a category or search for a component.</p>';
</script></body></html>
