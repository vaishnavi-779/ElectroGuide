<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Components | ElectroGuide</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="component-header"><a href="index.html" class="logo">⚡ ElectroGuide</a><div class="header-tools"><div class="global-search"><span>⌕</span><input id="global-search-input" type="search" placeholder="Search any component..." autocomplete="off"><div id="search-results" class="search-results"></div></div><a href="index.html" class="back-button">← Home</a></div></header>
<main class="component-page" id="component-content"><p>Loading...</p></main>
<script src="data.js"></script><script src="script,js"></script>
<script>
const content=document.getElementById("component-content"),p=new URLSearchParams(location.search),categoryKey=p.get("category"),componentName=p.get("name"),parent=p.get("parent");
function titleFromSlug(slug){return titleFromSlugForData(slug)}
function renderInternal(items){if(!items)return"";return `<section class="internal-section"><div class="section-heading"><span>02</span><h2>Inside this board</h2></div><p class="section-note">Select a part to learn what it does.</p><div class="internal-grid">${items.map(x=>`<button class="internal-card" onclick="openComponent('${x.id}','${componentName||""}')"><strong>${x.name}</strong><span>${x.description}</span><em>View component →</em></button>`).join("")}</div></section>`}
function render(item){const facts=item.facts||[["Category",item.category],["Type","Electronics component"]];return `<div class="component-badge">${item.category}</div><h1>${item.name.toUpperCase()}</h1><p class="component-intro">${item.description}</p><div class="component-main-card"><div class="component-image"><img src="${item.image}" alt="${item.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="component-illustration">⚡<span>${item.name}</span></div><p>${item.name}</p></div><div class="quick-info"><h2>Quick Specifications</h2>${facts.map(f=>`<div class="fact"><span>${f[0]}</span><strong>${f[1]}</strong></div>`).join("")}</div></div>${Object.entries(item.sections||{}).map(([h,t])=>`<section class="learning-section"><h2>${h}</h2><p>${t}</p></section>`).join("")}${renderInternal(item.internalComponents)}${parent?`<a class="parent-link" href="component.html?name=${encodeURIComponent(parent)}">← Back to ${titleFromSlug(parent)}</a>`:""}`}
if(componentName){const item=electroGuideDetails[componentName]||electroGuideInternalDetails[componentName];if(item){document.title=item.name+" | ElectroGuide";content.innerHTML=render(item)}else{content.innerHTML=`<h1>Component not found</h1><p class="component-intro">Use the search box to find another component.</p>`}}
else if(categoryKey&&categories[categoryKey]){const c=categories[categoryKey];document.title=c.name+" | ElectroGuide";content.innerHTML=`<div class="component-badge">COMPONENT LIBRARY</div><h1>${c.name.toUpperCase()}</h1><p class="component-intro">${c.items.length} components. Select one to open its full learning page.</p><div class="components">${c.items.map(id=>`<button class="category" onclick="openComponent('${id}')">${titleFromSlug(id)}</button>`).join("")}</div>`}
else content.innerHTML='<h1>Components</h1><p class="component-intro">Choose a category or search for a component.</p>';
</script></body></html>
