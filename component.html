<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Components | ElectroGuide</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile.css"></head><body>
<header class="component-header"><a href="index.html" class="logo">⚡ ElectroGuide</a><div class="header-tools"><div class="global-search"><span>⌕</span><input id="global-search-input" type="search" placeholder="Search any component..." autocomplete="off"><div id="search-results" class="search-results"></div></div><a href="index.html" class="back-button">← Home</a></div></header>
<main class="component-page" id="component-content"><p>Loading...</p></main>
<script src="data.js"></script><script src="board-details.js"></script><script src="script,js"></script><script>
const content=document.getElementById("component-content"),p=new URLSearchParams(location.search),categoryKey=p.get("category"),componentName=p.get("name"),parent=p.get("parent");function titleFromSlug(slug){return titleFromSlugForData(slug)}
function renderInternal(items,isBoard){if(!items?.length)return"";return `<section class="internal-section"><div class="section-heading"><span>02</span><h2>${isBoard?"Inside this board":"Inside this component"}</h2></div><p class="section-note">Select any hardware block to learn what it does.</p><div class="internal-grid">${items.map(x=>`<button class="internal-card" onclick="openComponent('${x.id}','${componentName||""}')"><strong>${x.name}</strong><span>${x.description}</span><em>View component →</em></button>`).join("")}</div></section>`}
function imageFallback(name){return "https://placehold.co/900x600/0d1b2a/36e0c5?text="+encodeURIComponent(name)}
function wikiTitle(name){const aliases={"Arduino Uno R3":"Arduino Uno","ATmega328P":"ATmega328P","IC 555":"555 timer IC","Op-Amp":"Operational amplifier","LDR":"Photoresistor","Seven Segment":"Seven-segment display","LCD":"Liquid-crystal display","ESP32-CAM":"ESP32-CAM","HC-05 Bluetooth":"HC-05","HC-06 Bluetooth":"HC-06","HC-SR04":"HC-SR04","LM35":"LM35","DHT11":"DHT11","DHT22":"DHT22","MPU6050":"MPU-6050","BMP280":"BMP280","MQ-2 Gas Sensor":"MQ-2","Arduino Mega":"Arduino Mega","Arduino Nano":"Arduino Nano","Raspberry Pi Pico":"Raspberry Pi Pico","DC Motor":"DC motor","Servo Motor":"Servo motor","Stepper Motor":"Stepper motor","MOSFET":"MOSFET","BJT":"Bipolar junction transistor","LED":"Light-emitting diode","Zener Diode":"Zener diode","Schottky Diode":"Schottky diode","Relay":"Relay","Transformer":"Transformer","Potentiometer":"Potentiometer","Thermistor":"Thermistor","Inductor":"Inductor","Capacitor":"Capacitor","Resistor":"Resistor"};return aliases[name]||name}
function setImage(src,caption){const img=document.getElementById("component-photo");if(!img||!src)return;img.src=src;img.dataset.real="1";const cap=document.getElementById("image-caption");if(cap)cap.textContent=caption||"Reference image"}
async function loadComponentImage(item){const img=document.getElementById("component-photo");if(!img)return;const name=wikiTitle(item.name);try{let r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(name),{headers:{Accept:"application/json"}});if(r.ok){const d=await r.json();const src=d.originalimage?.source||d.thumbnail?.source;if(src){setImage(src,"Reference image • Wikipedia");return}}
let search="https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(name+" electronics component")+"&gsrnamespace=0&gsrlimit=10&prop=pageimages|info&inprop=url&piprop=thumbnail&pithumbsize=900&format=json&origin=*";r=await fetch(search);if(r.ok){const d=await r.json();const pages=Object.values(d.query?.pages||{}).sort((a,b)=>(b.thumbnail?1:0)-(a.thumbnail?1:0));const page=pages.find(x=>x.thumbnail?.source);if(page){setImage(page.thumbnail.source,"Reference image • Wikipedia");return}}
/* Last attempt: Wikimedia Commons media search gives component-specific photographs even when Wikipedia has no article. */
const commons="https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(name)+"&gsrnamespace=6&gsrlimit=12&prop=imageinfo&iiprop=url|mime&iiurlwidth=900&format=json&origin=*";r=await fetch(commons);if(r.ok){const d=await r.json();const pages=Object.values(d.query?.pages||{});const page=pages.find(x=>x.imageinfo?.[0]?.mime?.startsWith("image/")&&x.imageinfo?.[0]?.thumburl);if(page){setImage(page.imageinfo[0].thumburl,"Reference image • Wikimedia Commons");return}}}catch(e){}img.src=imageFallback(item.name);const cap=document.getElementById("image-caption");if(cap)cap.textContent="Component illustration"}
function render(item){const facts=item.facts||[["Category",item.category],["Type","Electronics component"]];const isBoard=item.category==="Microcontrollers";const initial=item.image||imageFallback(item.name);return `<div class="component-badge">${item.category}</div><h1>${item.name.toUpperCase()}</h1><p class="component-intro">${item.description}</p><div class="component-main-card"><div class="component-image"><img id="component-photo" src="${initial}" alt="${item.name} electronic component" loading="eager"><div class="component-illustration">⚡<span>${item.name}</span></div><p id="image-caption">Loading component reference…</p></div><div class="quick-info"><h2>Quick Specifications</h2>${facts.map(f=>`<div class="fact"><span>${f[0]}</span><strong>${f[1]}</strong></div>`).join("")}</div></div>${Object.entries(item.sections||{}).map(([h,t])=>`<section class="learning-section"><h2>${h}</h2><p>${t}</p></section>`).join("")}${renderInternal(item.internalComponents,isBoard)}${parent?`<a class="parent-link" href="component.html?name=${encodeURIComponent(parent)}">← Back to ${titleFromSlug(parent)}</a>`:""}`}
if(componentName){const item=electroGuideDetails[componentName]||electroGuideInternalDetails[componentName];if(item){document.title=item.name+" | ElectroGuide";content.innerHTML=render(item);loadComponentImage(item)}else content.innerHTML=`<h1>Component not found</h1><p class="component-intro">Use the search box to find another component.</p>`}else if(categoryKey&&categories[categoryKey]){const c=categories[categoryKey];document.title=c.name+" | ElectroGuide";content.innerHTML=`<div class="component-badge">COMPONENT LIBRARY</div><h1>${c.name.toUpperCase()}</h1><p class="component-intro">${c.items.length} components. Select one to open its learning page.</p><div class="components">${c.items.map(id=>`<button class="category" onclick="openComponent('${id}')">${titleFromSlug(id)}</button>`).join("")}</div>`}else content.innerHTML='<h1>Components</h1><p class="component-intro">Choose a category or search for a component.</p>';
</script></body></html>
