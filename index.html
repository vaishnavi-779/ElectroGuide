<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroGuide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="logo">⚡ ElectroGuide</a>
    </header>

    <main class="home-page">
        <section class="home-hero">
            <h1>ElectroGuide</h1>
            <p>Your Interactive Electronics Encyclopedia</p>
        </section>

        <div class="category-grid" id="category-grid">
            <button class="category" data-category="passive">🔋 Passive Components</button>
            <button class="category" data-category="diodes">💡 Diodes</button>
            <button class="category" data-category="transistors">🔌 Transistors</button>
            <button class="category" data-category="ics">🧠 ICs</button>
            <button class="category" data-category="sensors">🌡️ Sensors</button>
            <button class="category" data-category="motors">⚙️ Motors</button>
            <button class="category" data-category="power">🔋 Power Components</button>
            <button class="category" data-category="displays">📺 Displays</button>
        </div>
    </main>

    <script src="script,js"></script>
</body>
</html>
